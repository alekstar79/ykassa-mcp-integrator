name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@alekstar79/ykassa-contracts
      - run: npx tsc --noEmit --project apps/api/tsconfig.json
      - run: npx tsc --noEmit --project apps/web/tsconfig.json
      - run: npx tsc --noEmit --project apps/configurator/tsconfig.json
      - run: npx tsc --noEmit --project packages/contracts/tsconfig.build.json
      - run: npm test
      - run: npm run build:packages
