name: Publish packages to GitHub Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version tag to publish and release, for example v1.1.1
        required: true
        type: string
      release_only:
        description: Create the GitHub Release without republishing packages
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: ${{ inputs.release_only != true }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Require a version tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a release tag such as v1.1.1, got '$RELEASE_TAG'."
            exit 1
          fi
          expected="${RELEASE_TAG#v}"
          node --input-type=module - "$expected" <<'NODE'
          import fs from 'node:fs';

          const expected = process.argv[2];
          const manifests = [
            'package.json',
            'packages/contracts/package.json',
            'apps/api/package.json',
            'apps/messenger/package.json',
            'apps/cli/package.json',
            'apps/web/package.json',
            'apps/configurator/package.json',
          ];

          for (const manifest of manifests) {
            const { version } = JSON.parse(fs.readFileSync(manifest, 'utf8'));
            if (version !== expected) {
              console.error(`${manifest} is ${version}; expected ${expected}.`);
              process.exitCode = 1;
            }
          }
          NODE

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@alekstar79'

      - run: npm ci
      - run: npm run build:packages

      - name: Publish contracts
        run: npm publish --workspace=@alekstar79/ykassa-contracts --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish API
        run: npm publish --workspace=@alekstar79/ykassa-api --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Messenger
        run: npm publish --workspace=@alekstar79/ykassa-messenger --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish CLI
        run: npm publish --workspace=@alekstar79/ykassa-mcp --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create_release:
    needs: publish
    if: ${{ always() && (inputs.release_only == true || needs.publish.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Require a version tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a release tag such as v1.1.1, got '$RELEASE_TAG'."
            exit 1
          fi

      - name: Create GitHub Release
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release '$RELEASE_TAG' already exists."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes
