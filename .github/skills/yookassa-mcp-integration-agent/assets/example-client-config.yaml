# Non-secret settings for a YooKassa MCP client.
# Store YOOKASSA_SHOP_ID and YOOKASSA_MCP_TOKEN in clients/<name>/.env.

# Must be a subset of tools confirmed by tools/list at runtime.
allowed_scenarios:
  - create_payment
  - get_payment
  - get_payments
  - create_invoice
  - get_invoice
  - get_refund
  - get_refunds

# Amount in RUB at or above which approval is required.
# 0 = require approval for every risky operation.
# Large number (e.g., 1e9) = automate small operations.
approval_threshold: 4000

# Whether human approval is mandatory regardless of amount.
require_human_confirmation: true

# Branding for the agent.
brand:
  display_name: "Online English School"

# Reference client metadata for demo materials.
demo_metrics:
  monthly_payments: 3000
  active_subscriptions: 800
  monthly_recurring_charges: 120
  average_check_rub: 3500
