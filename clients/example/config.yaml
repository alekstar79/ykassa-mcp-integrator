# Example client template. Copy this directory with:
#   cp -r clients/example clients/<name>
# or run:
#   npx @alekstar79/ykassa-mcp init <name>
# Edit config.yaml and fill in the client's .env file.

# MCP scenarios enabled for this client. Keep only the scenarios the client
# needs; at least one scenario is required.
# Known scenarios: create_payment, get_payment, get_payments, get_invoice,
# get_refund, get_refunds, create_invoice.
allowed_scenarios:
  - create_payment
  - get_payment
  - get_payments
  - get_invoice
  - get_refund
  - get_refunds
  - create_invoice

# Amount in RUB at or above which the operation requires approval. Must be
# zero or greater.
approval_threshold: 4000

# When true, require explicit human confirmation regardless of amount.
require_human_confirmation: false

# Request and attachment limits. max_messages: integer from 1 to 100;
# max_attachment_kb: integer from 1 to 1024.
limits:
  max_messages: 20
  max_attachment_kb: 100

# Values applied when the request does not provide them.
defaults:
  # Default currency: RUB, USD, or EUR.
  currency: RUB
  # VAT code from the current YooKassa list (1 to 12). Code 11 is the
  # standard 22% rate effective from 2026; choose a code for the transaction.
  vat_code: 1
  # Default capture behavior for payments.
  capture: true
  # Optional return URL. Leave empty when no return URL is configured.
  return_url: ""
  # Invoice lifetime in days, from 1 to 30.
  invoice_expiry_days: 30

# Optional non-secret brand information. display_name is shown in the UI.
brand:
  display_name: "Example Client"

# Reference UI configuration. Use "custom-ui" when the client supplies its
# own interface; use "reference-ui" for the bundled reference interface.
# accent: navy | terracotta | forest | graphite | cobalt | crimson
# radius: 0–24
# shadow: none | soft | medium
# font_pair: manrope+jetbrains | inter+jetbrains
# form_style: flat | card
# h1_size: s | m | l
ui:
  mode: reference-ui
  accent: navy
  radius: 2
  shadow: soft
  font_pair: manrope+jetbrains
  form_style: flat
  h1_size: m
